<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EXA.</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
 
    body {
      font-family: Arial, sans-serif;
      background-color: #234233;
      padding: 20px 0;
    }
 
    /* Contenedor principal de 1200px con relleno interno de 10px */
    .main-container {
      max-width: 1200px;
      margin: 0 auto;
      border: 2px solid #BCA1C2;
      padding: 10px;
      background-color: #A6C2A1;
    }
 
    /* Banner superior (img 400px alto) */
    .banner {
      width: 100%;
      height: 400px;
      background-color: #FF98BB;
      border: 1px solid #056C5C;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      margin-bottom: 10px;
    }
 
    /* Menú */
    .menu {
      width: 100%;
      background-color: #BA1650;
      border: 1px solid #1B2B42;
      padding: 10px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 10px;
    }
 
    /* Contenedor de las tarjetas/galería */
    .contenedor {
      border: 1px solid #708197;
      padding: 15px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }
 
    .card {
      border: 1px solid #8AC2C1;
      padding: 10px;
      background-color: #1B2B42;
      text-align: center;
    }
 
    .card .img-placeholder {
      width: 100%;
      height: 120px;
      background-color: #708197;
      margin-bottom: 5px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
 
    /* Pie de página fuera del contenedor principal */
    .pie {
      max-width: 1200px;
      margin: 10px auto 0;
      border: 2px solid #f1de86;
      padding: 15px;
      background-color: #8b76bb;
      display: flex;
      justify-content: space-between;
    }
 
    .pie-info {
      width: 50%;
    }
 
    .pie-links {
      width: 40%;
      border-left: 1px solid #8AC2C1;
      padding-left: 15px;
    }
  </style>
</head>
<body>
 
  <!-- Estructura Principal -->
  <div class="main-container">
    <!-- Banner de 400px de alto -->
    <div class="banner">
      <img src="netflix.jpg" width="205" height="167">
    </div>
 
    <!-- Menú -->
    <nav class="menu">
      Menu
    </nav>
 
    <!-- Contenedor interno -->
    <div class="contenedor">
      <div class="card">
        <div> <img src="bn.jpeg" width="205" height="167"></div>
        <p>BLANCA NIEVES

        </p>
      </div>
      <div class="card">
        <div> <img src="spider.jpg" width="205" height="167"></div>
        <p>SPIDERMAN</p>
      </div>
      <div class="card">
        <div> <img src="guardianes.jpg" width="205" height="167"></div>
        <p>GUARDIANES DE LA GALAXIA
        </p>
      </div>
      <div class="card">
        <div> <img src="buscando.jpg" width="205" height="167"></div>
        <p>BUSCANDO A NEMO
        </p>
      </div>
    </div>
  </div>
 
  <!-- Pie de página -->
  <footer class="pie">
    <div class="pie-info">
      <p>ELIGE TU FAVORITAS</p>
    </div>
    <div class="pie-links">
     <p><a href="https://www.netflix.com/mx/"> netflix </a></p>
    </div>
  </footer>
 
</body>
</html>
